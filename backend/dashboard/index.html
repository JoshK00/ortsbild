<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14181f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Ortsbild Dashboard</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Karte der Meldungen"></div>
<div class="map-vignette" aria-hidden="true"></div>
<!-- measures the safe areas of the phone (notch, home bar), see readInsets() in app.js -->
<div id="insets" aria-hidden="true"></div>
<!-- tells screen readers what changed in the list -->
<p id="announce" class="sr-only" role="status"></p>

<div class="ui">
  <!-- place and address search: always there on a big screen, a button that opens it on a phone -->
  <div id="search" class="search" role="search">
    <button type="button" id="search-toggle" class="glass icon-button search-toggle" aria-label="Ort oder Adresse suchen" aria-expanded="false" aria-controls="search-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button>
    <div id="search-panel" class="glass search-panel">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
      <input id="search-input" type="search" role="combobox" aria-label="Ort oder Adresse suchen" placeholder="Ort oder Adresse suchen" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" maxlength="100">
      <button type="button" id="search-clear" class="search-clear" aria-label="Suche leeren" hidden>×</button>
      <button type="button" id="search-close" class="search-close" aria-label="Suche schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="search-results" class="search-results" role="listbox" aria-label="Suchergebnisse" hidden></div>
    </div>
    <p id="search-status" class="sr-only" role="status" aria-live="polite"></p>
  </div>

  <div id="list-sheet" class="left" data-snap="peek">
    <button type="button" id="list-handle" class="sheet-handle" aria-controls="list" aria-expanded="false" aria-label="Liste vergrößern"><span class="grip"></span></button>

    <div class="sheet-head">
      <h1 class="sr-only">Meldungen nach Priorität</h1>
      <span id="sheet-count" class="sheet-count"></span>
    </div>
    <div id="counts" class="counts"></div>
    <p id="sheet-note" class="hint sheet-note" hidden></p>
    <div id="empty" class="glass panel empty" hidden></div>
    <ol id="list" class="list" aria-label="Meldungen nach Priorität"></ol>
  </div>

  <div class="center">
    <span id="mode" class="glass pill" role="status">Lädt</span>
    <p id="banner" class="glass pill banner" hidden></p>
  </div>

  <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="44" class="ring"/>
    <circle cx="50" cy="50" r="30" class="ring thin"/>
    <path d="M50 6v8M50 86v8M6 50h8M86 50h8" class="tick"/>
    <path d="M50 22l5 28h-10z" class="needle"/>
    <path d="M50 78l5-28h-10z" class="needle dim"/>
    <text x="50" y="21" class="north" text-anchor="middle">N</text>
  </svg>

  <section id="detail" class="glass panel detail" role="dialog" aria-modal="false" aria-label="Details der Meldung" data-snap="half" hidden>
    <button type="button" id="detail-handle" class="sheet-handle" aria-controls="detail-body" aria-expanded="false" aria-label="Die ganze Meldung zeigen"><span class="grip"></span></button>
    <div id="detail-body" class="detail-body"></div>
  </section>

  <div class="bottom-left">
    <p id="place" class="place"><span class="dot-white"></span><span id="place-name">Keine Meldungen</span></p>
    <p class="readout" aria-label="Kartenmitte"><span id="read-lat">0,000° N</span><span id="read-lon">0,000° O</span></p>
  </div>

  <div class="bottom-right">
    <button type="button" id="minimap-button" class="glass minimap-box" aria-label="Alle Meldungen zeigen">
      <span id="minimap"></span>
    </button>
    <div class="controls">
      <button type="button" id="zoom-in" class="glass icon-button zoom" aria-label="Vergrößern"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zoom-out" class="glass icon-button zoom" aria-label="Verkleinern"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="fit-all" class="glass icon-button" aria-label="Alle Meldungen zeigen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg></button>
    </div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/maplibre-gl-csp.js"></script>
<script src="vendor/leaflet-maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="score.js"></script>
<script src="search.js"></script>
<script src="sheet.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
