# Local stack that mimics the hosting: backend, gateway, Caddy, PostgreSQL and an S3-compatible storage.
# Start: docker compose up --build    (needs backend/.env, see .env.example)
# TODO: PostGIS image when the duplicate check by location needs it (backend/cases.py).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ortsbild
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ortsbild-local}
      POSTGRES_DB: ortsbild
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro   # runs the SQL files on the first start
    ports:
      # only reachable from this machine. POSTGRES_HOST_PORT in .env if 5432 is taken (e.g. by a PostgreSQL on Windows)
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ortsbild"]
      interval: 5s
      retries: 10

  # Local stand-in for the S3 object storage. MinIO's images were removed from Docker Hub (September 2026), so this is moto,
  # an S3 imitation for tests. It accepts any key and creates the two buckets at the start.
  # TODO: It keeps the files in memory only: after a restart of this container the photos of older reports are gone. Choose a
  #       lasting S3 server for local work (e.g. SeaweedFS or Garage) if that matters.
  s3:
    image: motoserver/moto:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        moto_server -H 0.0.0.0 -p 9000 &
        until curl -s -o /dev/null http://localhost:9000; do sleep 1; done
        curl -sf -o /dev/null -X PUT "http://localhost:9000/$${BUCKET_RAW}"
        curl -sf -o /dev/null -X PUT "http://localhost:9000/$${BUCKET_CLEAN}"
        wait
    environment:
      BUCKET_RAW: ${STORAGE_BUCKET_RAW:-ortsbild-raw}
      BUCKET_CLEAN: ${STORAGE_BUCKET_CLEAN:-ortsbild-clean}
    healthcheck:  # every second while it starts, then every 30 s, so the log stays readable
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:9000/$${BUCKET_CLEAN}"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      retries: 3
    ports:
      - "127.0.0.1:9000:9000"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    env_file: .env
    environment:
      # inside the compose network the services are reached by name
      DATABASE_URL: postgresql://ortsbild:${DATABASE_PASSWORD:-ortsbild-local}@postgres:5432/ortsbild
      STORAGE_ENDPOINT_URL: http://s3:9000
    ports:
      - "127.0.0.1:8000:8000"

  # The connector gateway: takes new reports in and hands them to the backend (services/gateway/README.md).
  # It reads the same .env (STORAGE_*, GATEWAY_KEY). Caddy below routes to it like on the server, port 8080 is the gateway alone.
  gateway:
    build: ../services/gateway
    depends_on:
      - backend
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
      STORAGE_ENDPOINT_URL: http://s3:9000
    ports:
      - "127.0.0.1:8080:8000"

  # The same routing as on the server (deploy/Caddyfile): POST /v1/reports goes to the gateway, everything else to the
  # backend, /internal is blocked. Use http://localhost:8088 like the server address, or http://caddy inside the network.
  caddy:
    image: caddy:2
    depends_on:
      - backend
      - gateway
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8088:80"

volumes:
  pgdata:
