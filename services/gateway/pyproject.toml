[project]
name = "gateway"
version = "0.1.0"
description = "Connector gateway: receives citizen reports from the iOS app and email and stores them in one canonical format."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pillow>=10.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI uses calls in defaults (Depends, Form)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
